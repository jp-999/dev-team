[project]
name = "devteam"
version = "0.1.0"
description = "Autonomous AI development team — a CrewAI engine driven by the shared agents/ role files."
readme = "README.md"
# CrewAI supports Python >=3.10 and <3.14, so the engine pins 3.13 (see repo README).
requires-python = ">=3.10,<3.14"
dependencies = [
  "crewai>=1.15,<2",
]

[project.scripts]
devteam = "devteam.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devteam"]
