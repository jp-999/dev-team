<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Dev Team · Office</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <div class="lights"><span class="l r"></span><span class="l y"></span><span class="l g"></span></div>
      <div class="logo"><span class="logo-mark"></span> AI DEV TEAM</div>
      <div class="ver">v0.4.0</div>
      <button id="autoMode" class="automode on" title="Toggle auto mode (run/pause the floor)">auto mode on</button>
      <div class="spacer"></div>
      <div class="tools">
        <button id="btnStandup" class="tbtn">stand-up</button>
        <button id="btnCouncil" class="tbtn">convene council</button>
        <select id="speed" class="tbtn" title="Speed">
          <option value="1">1×</option>
          <option value="2" selected>2×</option>
          <option value="4">4×</option>
        </select>
        <select id="teamFilter" class="tbtn" title="Highlight a squad">
          <option value="all">all squads</option>
          <option value="leadership">Leadership</option>
          <option value="atlas">Team Atlas</option>
          <option value="nova">Team Nova</option>
          <option value="orion">Team Orion</option>
          <option value="platform">Platform</option>
          <option value="upskilling">Upskilling (L&amp;D)</option>
        </select>
        <select id="chapterFilter" class="tbtn" title="Highlight a chapter (craft across squads)">
          <option value="all">all chapters</option>
          <option value="product">Product</option>
          <option value="design">Design</option>
          <option value="architecture">Architecture</option>
          <option value="engineering">Engineering</option>
          <option value="quality">Quality</option>
          <option value="platform">Platform</option>
          <option value="enablement">Enablement</option>
        </select>
        <div class="lnd" id="lnd" title="Upskilling improvements rolled out org-wide">L&amp;D · 0</div>
        <div class="approvals zero" id="approvals">approvals · 0</div>
        <div class="clock" id="clock">09:00</div>
      </div>
    </header>

    <div class="body">
      <div class="stage" id="stage">
        <canvas id="floor"></canvas>
        <div class="board" id="board"></div>
        <div class="chip" id="memChip">memory · minilm · hive online</div>
        <div class="legend" id="legend"></div>
      </div>
      <aside class="side">
        <div class="card" id="inspector"></div>
        <div class="card chatcard">
          <div class="cardhead"><h3>Instruct the team</h3><span class="muted" id="queueCount"></span></div>
          <select id="chatTarget" class="chatsel"></select>
          <div class="chatrow">
            <input id="chatInput" class="chatinput" placeholder="Tell them what to build or fix…" />
            <button id="chatSend" class="chatsend">Send</button>
          </div>
          <label class="chatprio"><input type="checkbox" id="chatPriority" /> priority · jump the queue</label>
        </div>
        <div class="card feedcard">
          <div class="cardhead"><h3>Activity feed</h3></div>
          <ul id="feed" class="feed"></ul>
        </div>
      </aside>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="office.js"></script>
</body>
</html>
